name: Gerar narração com Thalita

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narracao-lua-na-roca

jobs:
  narracao:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gerar os trechos de voz
        run: |
          python -m pip install 'edge-tts==7.3.1'
          python episodios/lua-na-roca/narrar.py
      - uses: actions/upload-artifact@v4
        with:
          name: narracao-thalita
          path: episodios/lua-na-roca/assets/voz/*.mp3
