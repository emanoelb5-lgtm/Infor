name: Renderizar a caminhada do elenco Infor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/renderizar-caminhada-infor.yml

permissions:
  contents: write

concurrency:
  group: caminhada-infor
  cancel-in-progress: false

env:
  EPISODIO: episodios/agrofloresta-solo
  MODELOS: personagens/retratos
  VIDEO: Agrofloresta_Da_Folha_ao_Solo_Caminhada.mp4
  ELENCO: Elenco_Infor_Seu_Joao_e_Dona_Maria_Caminhada.blend
  APROVADO: 6052c65d037ebe27e0edbee8b53e9e9520efe00c
  TAG: agrofloresta-da-folha-ao-solo-caminhada
  COPIA: render/agrofloresta-solo-caminhada
  RASCUNHO: caminhada-infor-quadros-${{ github.run_id }}
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'

jobs:
  preparar:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      lotes: ${{ steps.grupos.outputs.lotes }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/infor-blender
          key: blender-4.3.2-linux-x64
      - name: Preparar as cenas e conferir as malhas
        id: grupos
        run: |
          python -m pip install numpy
          python "$EPISODIO/montagem_caminhada.py" lotes > "$RUNNER_TEMP/lotes.json"
          printf 'lotes=%s\n' "$(cat "$RUNNER_TEMP/lotes.json")" >> "$GITHUB_OUTPUT"
          bash episodios/lua-na-roca-3d/preparar-blender.sh "$RUNNER_TEMP/infor-blender"
          blender="$RUNNER_TEMP/infor-blender/blender-4.3.2-linux-x64/blender"
          "$blender" -b -t 4 --python-exit-code 1 --python "$MODELOS/exportar_caminhada.py" -- "$RUNNER_TEMP/$ELENCO"
          if ! gh release view "$RASCUNHO" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RASCUNHO" --draft --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
              --title 'Caminhada em renderização' --notes 'Quadros temporários da edição.'
          fi
          gh release upload "$RASCUNHO" "$RUNNER_TEMP/$ELENCO" --repo "$GITHUB_REPOSITORY" --clobber

  renderizar:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        lote: ${{ fromJSON(needs.preparar.outputs.lotes) }}
    env:
      LOTE: ${{ matrix.lote }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/infor-blender
          key: blender-4.3.2-linux-x64
      - name: Renderizar os planos com as passadas revisadas
        run: |
          python -m pip install numpy
          bash episodios/lua-na-roca-3d/preparar-blender.sh "$RUNNER_TEMP/infor-blender"
          blender="$RUNNER_TEMP/infor-blender/blender-4.3.2-linux-x64/blender"
          destino="$RUNNER_TEMP/lote-$LOTE.zip"
          python "$EPISODIO/montagem_caminhada.py" renderizar "$LOTE" "$blender" "$destino" \
            > "$RUNNER_TEMP/render.log" 2>&1 || { tail -n 90 "$RUNNER_TEMP/render.log"; exit 1; }
          gh release upload "$RASCUNHO" "$destino" --repo "$GITHUB_REPOSITORY" --clobber

  montar:
    needs: [preparar, renderizar]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Substituir os dois planos e conferir o conteúdo
        run: |
          bash episodios/agrofloresta/preparar-ffmpeg.sh
          python -m pip install numpy
          git fetch --depth 1 --no-tags origin "$APROVADO"
          base="$RUNNER_TEMP/aprovado.mp4"
          git show "FETCH_HEAD:$EPISODIO/dist/Agrofloresta_Da_Folha_ao_Solo_Retratos.mp4" > "$base"
          gh release download "$RASCUNHO" --pattern 'lote-*.zip' --dir "$RUNNER_TEMP/quadros" --repo "$GITHUB_REPOSITORY"
          gh release download "$RASCUNHO" --pattern "$ELENCO" --dir "$RUNNER_TEMP/edicao" --repo "$GITHUB_REPOSITORY"
          python "$EPISODIO/montagem_caminhada.py" editar "$base" "$RUNNER_TEMP/quadros" "$RUNNER_TEMP/edicao/$VIDEO"
      - name: Publicar o filme e o arquivo Blender
        run: |
          bash "$EPISODIO/publicar-elenco.sh" "$RUNNER_TEMP/edicao/$VIDEO" "$RUNNER_TEMP/edicao/$ELENCO" \
            'Agrofloresta da folha ao solo · Caminhada revisada' \
            'Passadas revisadas na abertura e no retorno à muda. Inclui o Blender com a ação de caminhada reutilizável.'
