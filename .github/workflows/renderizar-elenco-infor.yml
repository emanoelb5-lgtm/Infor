name: Renderizar o novo elenco do Infor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/renderizar-elenco-infor.yml

permissions:
  contents: write

concurrency:
  group: elenco-infor-folha-ao-solo
  cancel-in-progress: false

env:
  EPISODIO: episodios/agrofloresta-solo
  MODELOS: personagens/elenco
  VIDEO: Agrofloresta_Da_Folha_ao_Solo_Elenco_Infor.mp4
  ELENCO: Elenco_Infor_Seu_Joao_e_Dona_Maria.blend
  APROVADO: 0ac0a57d8862e3a3fafa41ba77a8973cd47d2a1c
  TAG: agrofloresta-da-folha-ao-solo-elenco
  COPIA: render/agrofloresta-solo-elenco
  RASCUNHO: infor-elenco-quadros-${{ github.run_id }}
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'

jobs:
  preparar:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      lotes: ${{ steps.grupos.outputs.lotes }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: dados
        with:
          path: ${{ runner.temp }}/infor-mpfb
          key: mpfb-d9648f3257a0b9712281d466245f30d656250154-elenco
      - name: Preparar os recursos livres e os lotes
        id: grupos
        run: |
          python -m pip install numpy
          python "$MODELOS/obter-dados.py" "$RUNNER_TEMP/infor-mpfb"
          numero="$(python "$EPISODIO/montagem_elenco.py" lotes)"
          printf 'lotes=%s\n' "$numero" >> "$GITHUB_OUTPUT"
          if ! gh release view "$RASCUNHO" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RASCUNHO" --draft --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
              --title 'Quadros dos personagens em renderização' --notes 'Quadros em composição.'
          fi

  renderizar:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        lote: ${{ fromJSON(needs.preparar.outputs.lotes) }}
    env:
      LOTE: ${{ matrix.lote }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/infor-mpfb
          key: mpfb-d9648f3257a0b9712281d466245f30d656250154-elenco
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/infor-blender
          key: blender-4.3.2-linux-x64
      - name: Renderizar os personagens em 3D
        run: |
          python -m pip install numpy
          export INFOR_MPFB_DATA="$RUNNER_TEMP/infor-mpfb"
          python "$MODELOS/obter-dados.py" "$INFOR_MPFB_DATA"
          bash episodios/lua-na-roca-3d/preparar-blender.sh "$RUNNER_TEMP/infor-blender"
          blender="$RUNNER_TEMP/infor-blender/blender-4.3.2-linux-x64/blender"
          destino="$RUNNER_TEMP/lote-$LOTE.zip"
          python "$EPISODIO/montagem_elenco.py" renderizar "$LOTE" "$blender" "$destino" \
            > "$RUNNER_TEMP/render.log" 2>&1 || { tail -n 90 "$RUNNER_TEMP/render.log"; exit 1; }
          gh release upload "$RASCUNHO" "$destino" --repo "$GITHUB_REPOSITORY" --clobber

  montar:
    needs: [preparar, renderizar]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/infor-blender
          key: blender-4.3.2-linux-x64
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/infor-mpfb
          key: mpfb-d9648f3257a0b9712281d466245f30d656250154-elenco
      - name: Conferir o filme e empacotar o elenco
        run: |
          bash episodios/agrofloresta/preparar-ffmpeg.sh
          python -m pip install numpy
          git fetch --depth 1 --no-tags origin "$APROVADO"
          base="$RUNNER_TEMP/aprovado.mp4"
          git show "FETCH_HEAD:$EPISODIO/dist/Agrofloresta_Da_Folha_ao_Solo_Reel.mp4" > "$base"
          gh release download "$RASCUNHO" --pattern 'lote-*.zip' --dir "$RUNNER_TEMP/quadros" --repo "$GITHUB_REPOSITORY"
          python "$EPISODIO/montagem_elenco.py" editar "$base" "$RUNNER_TEMP/quadros" "$RUNNER_TEMP/edicao/$VIDEO"
          export INFOR_MPFB_DATA="$RUNNER_TEMP/infor-mpfb"
          python "$MODELOS/obter-dados.py" "$INFOR_MPFB_DATA"
          bash episodios/lua-na-roca-3d/preparar-blender.sh "$RUNNER_TEMP/infor-blender"
          blender="$RUNNER_TEMP/infor-blender/blender-4.3.2-linux-x64/blender"
          "$blender" -b -t 4 --python-exit-code 1 --python "$MODELOS/exportar.py" -- "$RUNNER_TEMP/edicao/$ELENCO"
      - name: Publicar os dois arquivos conferidos
        run: bash "$EPISODIO/publicar-elenco.sh" "$RUNNER_TEMP/edicao/$VIDEO" "$RUNNER_TEMP/edicao/$ELENCO"
