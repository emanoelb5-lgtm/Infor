name: Renderizar A Lua e o tempo da roça em 3D

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lua-na-roca-3d
  cancel-in-progress: true

env:
  EPISODIO: episodios/lua-na-roca-3d
  TAG: lua-na-roca-3d
  VIDEO: A_Lua_e_o_Tempo_da_Roca_Reel.mp4
  OPENBLAS_NUM_THREADS: '1'

jobs:
  decupar:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      planos: ${{ steps.planos.outputs.planos }}
      rascunho: ${{ steps.planos.outputs.rascunho }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restaurar a distribuição do Blender
        id: blender
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/infor-blender
          key: blender-4.3.2-linux-x64
      - name: Obter a distribuição do Blender
        if: steps.blender.outputs.cache-hit != 'true'
        run: bash "$EPISODIO/preparar-blender.sh" "$RUNNER_TEMP/infor-blender"
      - name: Compartilhar o Blender com os executores dos planos
        if: steps.blender.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/infor-blender
          key: blender-4.3.2-linux-x64
      - name: Preparar a decupagem
        id: planos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install numpy
          TEMP_TAG="temporario-lua-3d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PLANOS="$(python "$EPISODIO/montagem.py" planos)"
          gh release create "$TEMP_TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "Render em processamento" --notes "Arquivos desta execução."
          printf 'planos=%s\nrascunho=%s\n' "$PLANOS" "$TEMP_TAG" >> "$GITHUB_OUTPUT"

  renderizar:
    needs: decupar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plano: ${{ fromJSON(needs.decupar.outputs.planos) }}
    env:
      PLANO: ${{ matrix.plano }}
      TEMP_TAG: ${{ needs.decupar.outputs.rascunho }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restaurar a distribuição do Blender
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/infor-blender
          key: blender-4.3.2-linux-x64
      - name: Preparar Blender e FFmpeg
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install numpy
          bash "$EPISODIO/preparar-blender.sh" "$RUNNER_TEMP/infor-blender"
      - name: Renderizar o plano
        run: |
          python "$EPISODIO/montagem.py" render "$PLANO" --threads 4 --amostras 13 --denoise \
            --blender "$RUNNER_TEMP/infor-blender/blender-4.3.2-linux-x64/blender" \
            > "$RUNNER_TEMP/plano.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/plano.log"; exit 1; }
          tail -n 11 "$RUNNER_TEMP/plano.log"
      - name: Guardar o plano no rascunho da montagem
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TEMP_TAG" "$EPISODIO/.build/clipes/$PLANO.mp4" --repo "$GITHUB_REPOSITORY" --clobber

  montar:
    needs: [decupar, renderizar]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TEMP_TAG: ${{ needs.decupar.outputs.rascunho }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Montar com voz, trilha, legendas e capturas do AgroHere
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install numpy
          gh release download "$TEMP_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir "$RUNNER_TEMP/clipes"
          python "$EPISODIO/montagem.py" montar --clipes "$RUNNER_TEMP/clipes" \
            --saida "$RUNNER_TEMP/edicao/$VIDEO"
          sha256sum "$RUNNER_TEMP/edicao/$VIDEO"
      - name: Publicar a edição 3D
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/edicao/$VIDEO" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/edicao/$VIDEO" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title 'A Lua e o tempo da roça • edição 3D' \
              --notes-file "$EPISODIO/RELEASE.md"
          fi
      - name: Disponibilizar uma cópia versionada do MP4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --no-tags origin render/lua-na-roca-3d; then
            git checkout -B render/lua-na-roca-3d FETCH_HEAD
            git merge --no-edit --no-ff "$GITHUB_SHA"
          else
            git checkout -b render/lua-na-roca-3d
          fi
          mkdir -p "$EPISODIO/dist"
          cp "$RUNNER_TEMP/edicao/$VIDEO" "$EPISODIO/dist/$VIDEO"
          git add -f "$EPISODIO/dist/$VIDEO"
          if ! git diff --cached --quiet; then
            git commit -m 'Guardar o MP4 verificado da edição 3D'
          fi
          git push origin HEAD:render/lua-na-roca-3d
      - name: Remover os clipes temporários
        run: gh release delete "$TEMP_TAG" --repo "$GITHUB_REPOSITORY" --yes
