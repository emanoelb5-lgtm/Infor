name: Gravar a locução de Agrofloresta da folha ao solo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - episodios/agrofloresta-solo/roteiro.json
      - .github/workflows/narrar-folha-ao-solo.yml

permissions:
  contents: write

concurrency:
  group: voz-agrofloresta-solo
  cancel-in-progress: true

jobs:
  narrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gerar oito trechos em português brasileiro
        run: |
          python -m pip install 'edge-tts==7.3.1'
          python episodios/lua-na-roca/narrar.py \
            --roteiro episodios/agrofloresta-solo/roteiro.json --destino "$RUNNER_TEMP/narracao"
      - name: Guardar a locução junto às fontes do vídeo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --no-tags origin voz/agrofloresta-solo; then
            git switch -c voz/agrofloresta-solo FETCH_HEAD
            git merge --no-edit --no-ff "$GITHUB_SHA"
          else
            git switch -c voz/agrofloresta-solo
          fi
          mkdir -p episodios/agrofloresta-solo/assets/voz
          cp "$RUNNER_TEMP/narracao/"*.mp3 episodios/agrofloresta-solo/assets/voz/
          git add -f episodios/agrofloresta-solo/assets/voz/
          if ! git diff --cached --quiet; then
            git commit -m 'Guardar a locução de Agrofloresta da folha ao solo'
          fi
          git push origin HEAD:voz/agrofloresta-solo
