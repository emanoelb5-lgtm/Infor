name: Concluir uma renderização parcial de Agrofloresta

on:
  workflow_dispatch:
    inputs:
      execucao:
        description: Identificador da renderização com os quadros parciais
        required: true
        type: string
      lotes:
        description: Lista JSON com os lotes a recuperar
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/recuperar-agrofloresta.yml

permissions:
  contents: write

concurrency:
  group: recuperar-agrofloresta
  cancel-in-progress: true

env:
  EPISODIO: episodios/agrofloresta
  VOZ_REF: refs/heads/voz/agrofloresta
  VIDEO: Agrofloresta_Da_Semente_a_Sombra_Reel.mp4
  TAG: agrofloresta-da-semente-a-sombra
  COPIA: render/agrofloresta
  RASCUNHO: agrofloresta-quadros-${{ inputs.execucao || 46020015327 }}
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'

jobs:
  renderizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        lote: ${{ fromJSON(inputs.lotes || '[4]') }}
    env:
      LOTE: ${{ matrix.lote }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/infor-blender
          key: blender-4.3.2-linux-x64
      - name: Renderizar os quadros originais em 3D
        run: |
          bash "$EPISODIO/preparar-ffmpeg.sh"
          python -m pip install numpy
          bash episodios/lua-na-roca-3d/preparar-blender.sh "$RUNNER_TEMP/infor-blender"
          git fetch --no-tags --depth 1 origin "$VOZ_REF"
          mkdir -p "$RUNNER_TEMP/voz"
          git archive FETCH_HEAD "$EPISODIO/assets/voz" | tar -x -C "$RUNNER_TEMP/voz"
          python "$EPISODIO/montagem_agrofloresta.py" --voz "$RUNNER_TEMP/voz/$EPISODIO/assets/voz" render "$LOTE" \
            --blender "$RUNNER_TEMP/infor-blender/blender-4.3.2-linux-x64/blender" \
            --saida "$RUNNER_TEMP/lote-$LOTE.zip" > "$RUNNER_TEMP/render.log" 2>&1 \
            || { tail -n 100 "$RUNNER_TEMP/render.log"; exit 1; }
          gh release upload "$RASCUNHO" "$RUNNER_TEMP/lote-$LOTE.zip" --repo "$GITHUB_REPOSITORY" --clobber

  montar:
    needs: renderizar
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Montar e conferir o vídeo completo
        run: |
          bash "$EPISODIO/preparar-ffmpeg.sh"
          python -m pip install numpy
          git fetch --no-tags origin "$VOZ_REF"
          mkdir -p "$RUNNER_TEMP/voz"
          git archive FETCH_HEAD "$EPISODIO/assets/voz" | tar -x -C "$RUNNER_TEMP/voz"
          total="$(python "$EPISODIO/montagem_agrofloresta.py" --voz "$RUNNER_TEMP/voz/$EPISODIO/assets/voz" lotes | python -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          for tentativa in $(seq 1 48); do
            enviados="$(gh release view "$RASCUNHO" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(startswith("lote-") and endswith(".zip"))] | length')"
            if [[ "$enviados" == "$total" ]]; then
              break
            fi
            printf 'Quadros disponíveis em %s de %s lotes.\n' "$enviados" "$total"
            sleep 30
          done
          test "$enviados" = "$total"
          gh release download "$RASCUNHO" --pattern '*.zip' --dir "$RUNNER_TEMP/quadros" --repo "$GITHUB_REPOSITORY"
          python "$EPISODIO/montagem_agrofloresta.py" --voz "$RUNNER_TEMP/voz/$EPISODIO/assets/voz" montar \
            --pacotes "$RUNNER_TEMP/quadros" --saida "$RUNNER_TEMP/edicao/$VIDEO"
          sha256sum "$RUNNER_TEMP/edicao/$VIDEO"
      - name: Publicar o MP4 conferido
        run: |
          bash "$EPISODIO/publicar.sh" "$RUNNER_TEMP/edicao/$VIDEO"
